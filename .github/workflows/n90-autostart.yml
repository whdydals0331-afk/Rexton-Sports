# N90 자동실행 APK (헤드유닛 JY커스텀 N90, Android 4.4 용) 빌드 + 공개 다운로드 링크(Release "n90") 갱신.
# - n90-autostart/ 폴더나 이 파일이 바뀌어 main 에 푸시되면 돈다. 수동 실행도 가능.
# - 결과: https://github.com/whdydals0331-afk/Rexton-Sports/releases/download/n90/n90-autostart.apk
name: n90-autostart

on:
  push:
    branches: [main]
    paths:
      - "n90-autostart/**"
      - ".github/workflows/n90-autostart.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: n90-autostart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: n90-autostart
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # Android 4.4 는 v1(JAR) 서명이 있어야 설치된다. 없으면 여기서 실패한다.
      - name: Rename APK and verify v1 signature
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" ../n90-autostart.apk
          ls -l ../n90-autostart.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --verbose --min-sdk-version 19 ../n90-autostart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: n90-autostart-apk
          path: n90-autostart.apk
          if-no-files-found: error
          retention-days: 30

      # 로그인 없이 N90 브라우저에서도 받을 수 있는 고정 주소. 휴대폰 앱의 "latest" 와 겹치지 않게 태그는 "n90".
      - name: Publish release "n90"
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete n90 --repo "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create n90 n90-autostart.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "N90 자동실행 APK (빌드 #${GITHUB_RUN_NUMBER})" \
            --notes "헤드유닛(N90, Android 4.4) 에 설치하는 앱. 시동 신호를 받으면 고른 미러링 앱을 자동으로 띄운다. 휴대폰용이 아님." \
            --latest=false
