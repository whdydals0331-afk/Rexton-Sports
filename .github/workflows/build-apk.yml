# 렉스턴 차량모드 APK 빌드 + 공개 다운로드 링크(Release "latest") 갱신.
# - 앱 코드/빌드 파일/이 워크플로가 바뀌어 main 에 푸시되면 돈다. 수동 실행(workflow_dispatch)도 가능.
# - 결과: Actions 아티팩트 + https://github.com/whdydals0331-afk/Rexton-Sports/releases/download/latest/rexton-carmode.apk
name: build-apk

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 러너에는 Android SDK 가 기본 설치돼 있다 ($ANDROID_HOME).
      # compileSdk 35 플랫폼이 없으면 그때만 설치한다.
      - name: Check / install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "android-35 없음 → 설치"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
            ls "$ANDROID_HOME/platforms"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK and show signature
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" rexton-carmode.apk
          ls -l rexton-carmode.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --verbose --print-certs rexton-carmode.apk
          "$BT/aapt" dump badging rexton-carmode.apk | head -n 3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: rexton-carmode-apk
          path: rexton-carmode.apk
          if-no-files-found: error
          retention-days: 30

      # 로그인 없이 휴대폰에서 받을 수 있는 고정 주소를 만들기 위해 매번 "latest" 릴리스를 새로 만든다.
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create latest rexton-carmode.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "최신 APK (빌드 #${GITHUB_RUN_NUMBER})" \
            --notes "렉스턴 차량모드 버전 1.0.${GITHUB_RUN_NUMBER} (커밋 ${GITHUB_SHA::7}). 휴대폰에서 rexton-carmode.apk 를 눌러 받은 뒤 설치하세요." \
            --latest
