plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jydiag.n90auto'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jydiag.n90auto'
        // JY커스텀 N90 은 Android 4.4 KitKat (API 19) 로 표기되어 있음
        minSdk 19
        // targetSdk 19: 런타임 권한/패키지 가시성/백그라운드 실행 제한이 적용되지 않음
        //noinspection ExpiredTargetSdkVersion
        targetSdk 19
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "0.2.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        debug {
            // 매 빌드 같은 서명 → 새 버전을 지우지 않고 덮어 설치할 수 있다 (차량모드 앱과 같은 개인용 디버그 키)
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            // Android 4.4 는 v1(JAR) 서명만 인식한다. minSdk<24 이면 AGP 가 자동으로 켜지만 명시해 둔다.
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable.add('ExpiredTargetSdkVersion')
        disable.add('OldTargetApi')
    }
}

// 의존성 없음: android.app.Activity 등 프레임워크 API 만 사용
